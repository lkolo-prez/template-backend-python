version: 2
updates:
  # Python dependencies managed by uv (uv.lock + pyproject.toml).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]

  # GitHub Actions — keep pinned SHAs current (Dependabot updates the pin AND
  # the trailing version comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "github-actions"]

  # Dockerfile base images.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build"
    labels: ["dependencies", "docker"]
