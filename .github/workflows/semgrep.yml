name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload SARIF
    container:
      image: semgrep/semgrep@sha256:8f3c2a0b0a6e2c4a0d9b5e4f1c2a3b4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Semgrep scan
        run: semgrep ci --sarif --output=semgrep.sarif
        env:
          # Curated rulesets; no Semgrep AppSec Platform token required.
          SEMGREP_RULES: >-
            p/default
            p/python
            p/security-audit
            p/secrets

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          sarif_file: semgrep.sarif
