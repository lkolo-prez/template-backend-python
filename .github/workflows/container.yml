name: Container

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml to publish a release-please tag.
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.2.3); empty for branch builds.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release
  # publish never cancels (or is cancelled by) a regular push build.
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------- #
  # Org-level alternative (not used): the reusable workflow below lives in     #
  # aircloud/.github, which this repository cannot reach, so the job failed    #
  # to resolve. It is kept here, commented out, as a reference for adopters.   #
  # ------------------------------------------------------------------------- #
  # # ------------------------------------------------------------------------- #
  # # Preferred path: delegate to the org reusable workflow which builds, scans #
  # # (Trivy), generates an SBOM (syft -> CycloneDX), pushes to GHCR, signs the #
  # # image keylessly with cosign, and attaches SLSA build provenance.          #
  # # The reusable workflow centralises supply-chain policy across all repos.    #
  # # ------------------------------------------------------------------------- #
  # build-and-publish:
  #   name: Build, scan, sign, attest
  #   permissions:
  #     contents: read
  #     packages: write        # push image to GHCR
  #     id-token: write        # OIDC for cosign keyless signing
  #     attestations: write    # build-provenance attestation
  #     security-events: write # upload Trivy SARIF
  #   uses: aircloud/.github/.github/workflows/reusable-container.yml@7c3e9a1d2f6b8c0a4e5d7f9b1c2a3e4d5f6a7b8c # v1.4.0
  #   with:
  #     image: ghcr.io/aircloud/template-backend-python
  #     dockerfile: Dockerfile
  #     context: .
  #     platforms: linux/amd64,linux/arm64
  #     # Only push/sign on main and tags; PRs build for validation only.
  #     push: ${{ github.event_name != 'pull_request' }}
  #     cosign-sign: true
  #     generate-sbom: true
  #     trivy-scan: true
  #     provenance: true

  # ------------------------------------------------------------------------- #
  # Self-contained build: build, scan (Trivy), SBOM (syft -> CycloneDX), push  #
  # to GHCR, keyless cosign signature and SLSA build provenance.               #
  # ------------------------------------------------------------------------- #
  build-inline:
    name: Build, scan, sign, attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign image (keyless)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (syft -> CycloneDX)
        # The digest only exists in the registry when the image was pushed.
        if: ${{ github.event_name != 'pull_request' }}
        uses: anchore/sbom-action@9246b90769f852b3a8921f330c59e0b3f439d6e9 # v0.17.8
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Scan image with Trivy
        if: ${{ github.event_name != 'pull_request' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          sarif_file: trivy-results.sarif

      - name: Attest build provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
