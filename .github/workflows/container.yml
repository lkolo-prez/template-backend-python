name: Container

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------- #
  # Preferred path: delegate to the org reusable workflow which builds, scans #
  # (Trivy), generates an SBOM (syft -> CycloneDX), pushes to GHCR, signs the #
  # image keylessly with cosign, and attaches SLSA build provenance.          #
  # The reusable workflow centralises supply-chain policy across all repos.    #
  # ------------------------------------------------------------------------- #
  build-and-publish:
    name: Build, scan, sign, attest
    permissions:
      contents: read
      packages: write        # push image to GHCR
      id-token: write        # OIDC for cosign keyless signing
      attestations: write    # build-provenance attestation
      security-events: write # upload Trivy SARIF
    uses: aircloud/.github/.github/workflows/reusable-container.yml@7c3e9a1d2f6b8c0a4e5d7f9b1c2a3e4d5f6a7b8c # v1.4.0
    with:
      image: ghcr.io/aircloud/template-backend-python
      dockerfile: Dockerfile
      context: .
      platforms: linux/amd64,linux/arm64
      # Only push/sign on main and tags; PRs build for validation only.
      push: ${{ github.event_name != 'pull_request' }}
      cosign-sign: true
      generate-sbom: true
      trivy-scan: true
      provenance: true

  # ------------------------------------------------------------------------- #
  # Self-contained fallback shown for transparency. Disabled by default; it    #
  # documents exactly what the reusable workflow does, so this template is     #
  # readable even without access to aircloud/.github. Flip `if:` to run it.    #
  # ------------------------------------------------------------------------- #
  build-inline:
    name: Build inline (reference, disabled)
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    env:
      IMAGE: ghcr.io/aircloud/template-backend-python
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign image (keyless)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (syft -> CycloneDX)
        uses: anchore/sbom-action@9246b90769f852b3a8921f330c59e0b3f439d6e9 # v0.17.8
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          sarif_file: trivy-results.sarif

      - name: Attest build provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
