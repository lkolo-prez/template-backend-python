name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  release-please:
    name: Prepare release PR / tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # create release commits, tags, GitHub releases
      pull-requests: write   # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          # release-type and packages are configured in
          # release-please-config.json + .release-please-manifest.json.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When release-please cuts a tag, this job builds and publishes the release
  # artifacts via the org reusable container workflow (signed + attested).
  publish:
    name: Publish release image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: aircloud/.github/.github/workflows/reusable-container.yml@7c3e9a1d2f6b8c0a4e5d7f9b1c2a3e4d5f6a7b8c # v1.4.0
    with:
      image: ghcr.io/aircloud/template-backend-python
      dockerfile: Dockerfile
      context: .
      platforms: linux/amd64,linux/arm64
      push: true
      cosign-sign: true
      generate-sbom: true
      trivy-scan: true
      provenance: true
      tag: ${{ needs.release-please.outputs.tag_name }}
