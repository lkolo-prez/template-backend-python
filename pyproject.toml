[project]
name = "template-backend-python"
version = "0.1.0"
description = "Production-grade FastAPI HTTP microservice template (aircloud)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "aircloud Platform Team", email = "platform@aircloud.com.pl" }]
keywords = ["fastapi", "microservice", "template", "asgi", "uv"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
# OpenTelemetry is opt-in to keep the base image lean.
otel = [
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.urls]
Homepage = "https://github.com/aircloud/template-backend-python"
Repository = "https://github.com/aircloud/template-backend-python"
Issues = "https://github.com/aircloud/template-backend-python/issues"

[dependency-groups]
# uv-native dev dependency group (PEP 735). Installed by `uv sync --all-groups`.
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "bandit[toml]>=1.9.4",
  "pip-audit>=2.7.3",
  "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# --------------------------------------------------------------------------- #
# uv                                                                           #
# --------------------------------------------------------------------------- #
[tool.uv]
# Treat the dev group as default-installed for local development.
default-groups = ["dev"]

# --------------------------------------------------------------------------- #
# Ruff (lint + format)                                                         #
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",          # pyflakes
  "I",          # isort
  "N",          # pep8-naming
  "UP",         # pyupgrade
  "B",          # flake8-bugbear
  "C4",         # flake8-comprehensions
  "S",          # flake8-bandit
  "A",          # flake8-builtins
  "PT",         # flake8-pytest-style
  "SIM",        # flake8-simplify
  "RUF",        # ruff-specific
  "ASYNC",      # flake8-async
  "TID",        # flake8-tidy-imports
  "D",          # pydocstyle
]
ignore = [
  "D203",       # incompatible with D211
  "D213",       # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "PLR2004"]  # asserts and docstrings relaxed in tests

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy (strict)                                                                #
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party libs without bundled type stubs.
module = ["opentelemetry.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# pytest + coverage                                                            #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=app",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=85",
]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["src/app/telemetry.py"]  # exercised only with optional otel extras

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# --------------------------------------------------------------------------- #
# bandit                                                                       #
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests"]
